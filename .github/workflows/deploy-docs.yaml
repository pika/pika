name: Deploy Docs

# Entry point for publishing the documentation site. The work lives in the
# reusable `_deploy-docs.yaml`; this file only decides what to publish.
#
#   - push to `main`    -> `dev`
#   - manual dispatch   -> whatever the operator asks for
#
# Release versions are NOT published from here. `release.yaml` calls
# `_deploy-docs.yaml` itself, as its last job, so the docs go out only after the
# wheel is on PyPI and the release is otherwise complete, and so a failed docs
# deploy fails the release run rather than being reported nowhere.
#
# There is deliberately no `on.push.tags` trigger. A tag pushed by `release.yaml`
# authenticates with GITHUB_TOKEN, and GitHub documents that events triggered by
# GITHUB_TOKEN do not create a workflow run, so such a trigger would be dead for
# every automated release while still firing for a hand-pushed tag. That split
# behaviour is worse than not having it: a hand-pushed maintenance tag would
# publish and take the `latest` alias with no release-flow gating at all.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build from, e.g. main or 1.5.0'
        required: true
        type: string
        default: main
      version:
        description: 'Version name to publish under: dev, MAJOR.MINOR, or a full pre-release version'
        required: true
        type: string
        default: dev
      aliases:
        description: 'Space-separated aliases to point at this version, e.g. latest. Empty for none'
        required: false
        type: string
        default: ''
      set-default:
        description: 'Point the site-root redirect at the first alias'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A push to `main` republishes `dev`. The alias inputs stay empty: `dev` takes
  # `latest` only during the one-time bootstrap, which RELEASE.md covers, and
  # never afterwards.
  dev:
    if: github.event_name == 'push'
    uses: ./.github/workflows/_deploy-docs.yaml
    with:
      ref: ${{ github.sha }}
      version: dev

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_deploy-docs.yaml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      aliases: ${{ inputs.aliases }}
      set-default: ${{ inputs.set-default }}
