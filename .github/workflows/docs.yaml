name: Docs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install hatch

      - name: Build documentation
        run: hatch run docs:build

      # `--strict` refuses a cross-reference whose target is missing, but not one
      # that never parsed as a reference. See .ci/docs_check.py and #1750.
      - name: Check the built site for unrendered markup
        run: python .ci/docs_check.py site
