name: release

on:
  # A pushed tag is the whole trigger for a real release. This workflow never
  # writes to `main`, because it cannot: `main` requires a pull request and
  # restricts pushes to the Maintainers team, and classic branch protection has
  # no way to grant `GITHUB_TOKEN` a bypass - adding an app to the push
  # allowlist does not exempt it from the review requirement. The version bump
  # therefore lands through a pull request like any other change, which also
  # means the commit that gets tagged is one `tests-passed` has already seen.
  # The bot used to create that commit after the build and push it untested.
  # See RELEASE.md and #1728.
  #
  # Three conditions make this trigger fire, and all three fail silently:
  #
  # 1. A person pushes the tag, not a workflow. Events triggered by
  #    `GITHUB_TOKEN` do not create workflow runs; only `workflow_dispatch` and
  #    `repository_dispatch` are exempt. #1614 hit exactly this and its commit
  #    message says "tag push cannot trigger it", which was true of the tag
  #    *that workflow* pushed and is not true of one pushed from a terminal.
  #    That same commit kept the tag trigger "for manually pushed tags".
  # 2. One tag per push. GitHub creates no events at all when more than three
  #    tags are pushed at once, so `release.py tag` pushes a single tag by name
  #    rather than `git push --tags` or `--follow-tags`.
  # 3. The tagged commit contains this file, with this trigger. A `push` event
  #    reads the workflow from the pushed ref, not from the default branch, so
  #    tagging a commit from before this landed would do nothing.
  push:
    # Deliberately broader than `RELEASABLE_TAG`, which `classify` enforces. A
    # narrow glob means a tag this scheme refuses starts no run at all: no
    # annotation, no failure, nothing to notice, while three documents promise it
    # is "refused". Catch anything that looks like a version or carries the `v`
    # prefix pika does not use, and let the tested helper reject it by name.
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        required: true
        type: choice
        default: dry-run
        options:
          # test:     publish a throwaway X.Y.Z.dev<run> to TestPyPI; no tag or
          #           GitHub Release. Repeatable.
          # dry-run:  compute the version and build, but publish nothing
          #
          # `release` and `prerelease` are deliberately absent: both come from
          # pushing a tag, so there is no dispatch that publishes to PyPI.
          - dry-run
          - test
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          # Only decides the throwaway version a `test` or `dry-run` builds, so
          # `none` is here for completeness rather than because a mode needs it.
          # `none` fails on a version with no pre-release suffix, which is
          # correct rather than a defect: the computed version would equal the
          # current one, and a release has to move.
          # Choosing the version of a real release is a human decision now; run
          # `release.py compute` locally to get the number to write into
          # the files. See RELEASE.md.
          - patch
          - minor
          - major
          - none

# Serialize releases so a tag push and a dispatch cannot publish at once.
#
# `queue: max` is as load-bearing here as in `_deploy-docs.yaml`, which explains
# it at length: under the default `queue: single` GitHub keeps one pending run
# per group and cancels and replaces any other, which `cancel-in-progress: false`
# does not prevent. A second tag push while the first still ran would evict the
# first's pending work and publish nothing, silently.
concurrency:
  group: release
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Verify and build
    # A tag push arrives as `refs/tags/<version>`, and the guards below prove the
    # tagged commit is on `main`. A dispatch has no such guard, so it keeps the
    # branch restriction the old workflow had: without it,
    # `gh workflow run release.yaml --ref some-branch -f mode=test` builds an
    # unreviewed tree and publishes it to TestPyPI under the real project name.
    if: >-
      ${{ github.event_name == 'push' ||
          github.ref == format('refs/heads/{0}', 'main') }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      docs-version: ${{ steps.version.outputs.docs_version }}
      docs-aliases: ${{ steps.version.outputs.docs_aliases }}
      docs-set-default: ${{ steps.version.outputs.docs_set_default }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the tag path can prove the tagged commit is on
          # `main` rather than on a branch that never merged.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Determine the version and what to do with it
        id: version
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          BUMP: ${{ inputs.bump }}
          RUN_NUMBER: ${{ github.run_number }}
          TAG: ${{ github.ref_name }}
        run: |
          # Nothing else in this job has installed anything yet, and the helper
          # parses with `packaging` rather than hand-rolled string work.
          python -m pip install --quiet --upgrade packaging

          # `q` after the first match: without it a second column-0
          # `version = "` line emits a multi-line `current=` into
          # `$GITHUB_OUTPUT`, where the Python side takes only the first.
          current=$(sed -nE 's/^version = "([^"]+)".*/\1/p;/^version = "/q' pyproject.toml)
          echo "current=$current" >> "$GITHUB_OUTPUT"

          # Both decisions live beside `.ci/release.py`, with unit tests in
          # `tests/unit/`, for the same reason the alias
          # decision lives in `docs_site.py`: they are parsing plus a state
          # transition, and what they produce becomes a PyPI release and a docs
          # directory that none of us can take back. As shell both were wrong -
          # every bump incremented, so a published pre-release could not be
          # promoted, and the stable docs version read two variables that were
          # never assigned, so it evaluated to `.`.
          if [ "$EVENT" = "push" ]
          then
            # The tag decides everything: whether this is a pre-release, the
            # version published, and the documentation parameters. `classify`
            # refuses any tag this scheme does not publish, so `1.5.0.dev3` or
            # `v1.5.0` fails here rather than part-way through publishing.
            python .ci/release.py classify --tag "$TAG" \
              >> "$GITHUB_OUTPUT"
            echo "Releasing from tag $TAG"
          else
            new_version=$(python .ci/release.py compute \
              --current "$current" \
              --bump "$BUMP" \
              --mode "$MODE" \
              --run-number "$RUN_NUMBER")
            {
              echo "mode=$MODE"
              echo "version=$new_version"
              # `test` and `dry-run` never tag, so they never deploy docs.
              echo "docs_version="
              echo "docs_aliases="
              echo "docs_set_default=false"
            } >> "$GITHUB_OUTPUT"
            echo "Bumping $current -> $new_version (mode: $MODE)"
          fi

      # Pushing a tag is the whole trigger, and a tag carries no review, so
      # these three checks are all that stand between a mistyped
      # `git push origin <tag>` and a published release.
      - name: Verify the tag against the commit it names
        if: ${{ github.event_name == 'push' }}
        env:
          TAG: ${{ github.ref_name }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          # The artifact is built from the files at this commit, not from the tag
          # text, so a tag that disagrees with `pyproject.toml` would publish one
          # version under another's name. This catches the realistic mistake:
          # tagging before the bump commit has landed, or tagging the wrong one.
          if [ "$TAG" != "$CURRENT" ]
          then
            echo "::error::Tag $TAG does not match pyproject.toml, which says ${CURRENT:-nothing}. Tag the commit that bumps the version."
            exit 1
          fi

          # `pika/__init__.py` is what `pika.__version__` reports to anyone who
          # installed the wheel, and nothing else checks the two files agree.
          init=$(sed -nE "s/^__version__ = ['\"]([^'\"]+)['\"].*/\1/p" \
            pika/__init__.py)
          if [ "$init" != "$CURRENT" ]
          then
            echo "::error::pyproject.toml says $CURRENT but pika/__init__.py says ${init:-nothing}"
            exit 1
          fi

          # `main` is the only branch whose content passed `tests-passed`, so a
          # tag anywhere else would publish unreviewed code.
          #
          # The refspec is spelled out so the ref this check reads is a stated
          # outcome of the fetch rather than a side effect. A bare
          # `git fetch origin main` does write `refs/remotes/origin/main`, by
          # git's opportunistic remote-tracking update - that was measured, and
          # an earlier version of this comment claimed otherwise - but it is a
          # convenience, not something the refspec asked for.
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main. Land the bump on main before tagging it."
            exit 1
          fi
          echo "::notice::$TAG matches both version files and is on main"

      # A tag pushed by hand can be lightweight and unsigned, and all four guards
      # above would pass it. The tag is the only record of what the published
      # bytes were built from, so its shape is checked rather than assumed. The
      # signature is checked for presence, not validity: verifying it would need
      # the signer's public key on the runner. All three armour headers are
      # accepted because `git tag --sign` honours `gpg.format`, so a correctly
      # signed tag may be OpenPGP, SSH or x509; a PGP-only test rejected an
      # SSH-signed tag after it had already been pushed, and advised recreating
      # it, which reproduces a byte-identical tag.
      - name: Verify the tag is annotated and signed
        if: ${{ github.event_name == 'push' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          kind=$(git cat-file -t "$TAG")
          if [ "$kind" != "tag" ]
          then
            echo "::error::$TAG is a $kind, not an annotated tag. Delete it and re-create it with release.py tag, which annotates and signs."
            exit 1
          fi
          if ! git cat-file tag "$TAG" |
               grep -qE '^-----BEGIN (PGP|SSH) SIGNATURE-----|^-----BEGIN SIGNED MESSAGE-----'
          then
            echo "::error::$TAG carries no signature. Delete it and re-create it with release.py tag."
            exit 1
          fi
          echo "::notice::$TAG is annotated and signed"

      # Only the dispatch modes need this: they publish a version nobody wrote
      # down, so the files have to be edited to match. On the tag path the files
      # already carry the version and the step above proved it, which is why the
      # working tree is never modified for a real release.
      - name: Update version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # `[^\"]*` rather than `.*`: the greedy form reaches the last quote on
          # the line, so a trailing comment containing quotes was swallowed.
          sed -i "s/^version = \"[^\"]*\"/version = \"$NEW_VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = '[^']*'/__version__ = '$NEW_VERSION'/" pika/__init__.py

          # `sed -i` exits 0 when nothing matched, so a reformatted declaration
          # would build a wheel whose metadata disagrees with the version this
          # job reported. `write_version` raises in that case; this is the copy
          # that did not notice.
          for file in pyproject.toml pika/__init__.py
          do
            if ! grep -q "$NEW_VERSION" "$file"
            then
              echo "::error::$file does not declare $NEW_VERSION after the rewrite; its version line is not in the expected form"
              exit 1
            fi
          done

      # Build once, before anything is published, so a broken build aborts the
      # release while it is still only a tag. Every downstream publish consumes
      # this exact artifact rather than rebuilding, so the bytes tested are the
      # bytes shipped. Runs in all modes, including dry-run, so a dry run
      # validates that the project still builds.
      - name: Build distribution
        run: |
          python -m pip install build twine --upgrade
          python -m build --sdist --wheel --outdir dist/ .
          twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # Last of the guards, and the only one that outlives the run: a git tag can
      # be deleted and re-pushed, but a PyPI version is immutable and cannot be
      # re-uploaded even after deletion. `twine` would fail on its own, after
      # uploading whichever files it managed first; this says so beforehand.
      - name: Refuse a version PyPI already has
        if: >-
          ${{ steps.version.outputs.mode == 'release' ||
              steps.version.outputs.mode == 'prerelease' }}
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Only a 404 means "not published". Testing for 200 made every other
          # status a green light, so a 429, a 503 or a redirect would wave an
          # already-published version through to `twine`, which is the single
          # unrecoverable mistake this step exists to prevent. `tag_release.py`
          # gets this right and says why; this is the shell copy that did not.
          status=$(curl -sS --location --max-time 30 --retry 3 \
            --retry-connrefused -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/pika/$NEW_VERSION/json")
          case "$status" in
            404)
              echo "::notice::pika $NEW_VERSION is not on PyPI"
              ;;
            200)
              echo "::error::pika $NEW_VERSION is already on PyPI. A version cannot be re-uploaded, even after deletion; bump to the next one. Delete the tag before re-tagging."
              exit 1
              ;;
            *)
              echo "::error::PyPI answered HTTP $status for $NEW_VERSION, so whether it is already published is unknown. Refusing rather than guessing."
              exit 1
              ;;
          esac

      - name: Dry-run summary
        if: ${{ steps.version.outputs.mode == 'dry-run' }}
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::notice::Dry run - would release pika $NEW_VERSION (nothing published)"
          git --no-pager diff

  # The publish jobs only download and publish the artifact built by the
  # release job; they never rebuild, so the bytes tested are the bytes
  # shipped. Authentication uses the PYPI_API_TOKEN / TEST_PYPI_API_TOKEN
  # repository secrets rather than trusted publishing, so the API token is
  # exposed only to the publish jobs, not to the build.
  publish-pypi:
    name: Publish to PyPI
    needs: release
    if: >-
      ${{ needs.release.outputs.mode == 'release' ||
          needs.release.outputs.mode == 'prerelease' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pika/${{ needs.release.outputs.version }}/
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Attestations require trusted publishing; with token auth they
          # must be disabled explicitly or the action errors.
          attestations: false

  publish-test-pypi:
    name: Publish to TestPyPI
    needs: release
    if: ${{ needs.release.outputs.mode == 'test' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pika/${{ needs.release.outputs.version }}/
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          # Attestations require trusted publishing; with token auth they
          # must be disabled explicitly or the action errors.
          attestations: false

  smoke-test:
    name: Smoke-test the published wheel
    needs: [release, publish-pypi, publish-test-pypi]
    # Run for whichever publish actually happened. This is skipped for
    # dry-run (neither publish ran) and fires for the one publish job whose
    # index received the wheel.
    if: >-
      always() && needs.release.result == 'success' &&
      (needs.publish-pypi.result == 'success' ||
       needs.publish-test-pypi.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Start RabbitMQ
        run: ./.ci/linux/gha-setup.sh

      - name: Install pika and smoke-test
        env:
          NEW_VERSION: ${{ needs.release.outputs.version }}
          # The TestPyPI index when the test publish ran, else empty (real
          # PyPI). pika has no runtime dependencies, so installing from the
          # TestPyPI index needs no fallback index for dependency resolution.
          INDEX_URL: ${{ needs.publish-test-pypi.result == 'success' && 'https://test.pypi.org/simple/' || '' }}
        run: |
          python -m venv smoke-venv
          pip_args=()
          if [ -n "$INDEX_URL" ]
          then
            pip_args+=(--index-url "$INDEX_URL")
          fi
          # PyPI/TestPyPI are eventually consistent: a fresh install can 404
          # for a minute or two right after publish. Retry until the
          # just-published version installs, up to ~5 minutes.
          attempt=0
          until smoke-venv/bin/pip install "${pip_args[@]}" "pika==$NEW_VERSION"
          do
            attempt=$((attempt + 1))
            if (( attempt >= 20 ))
            then
              echo "::error::pika $NEW_VERSION not installable after $attempt attempts"
              exit 1
            fi
            echo "pika $NEW_VERSION not available yet; retrying in 15s (attempt $attempt)"
            sleep 15
          done
          smoke-venv/bin/python .ci/smoke_test.py

  github-release:
    name: Create GitHub Release
    # `smoke-test` too, so the Release does not exist for a wheel that failed
    # it. Without it this ran concurrently with the smoke test and fired every
    # watcher's release notification regardless, while only `deploy-docs` was
    # gated. RELEASE.md presents the order as publish, smoke-test, Release,
    # docs, and the recovery procedure assumes the Release is absent when an
    # earlier step failed.
    needs: [release, publish-pypi, smoke-test]
    if: >-
      ${{ !cancelled() &&
          (needs.release.outputs.mode == 'release' ||
           needs.release.outputs.mode == 'prerelease') &&
          needs.smoke-test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.version }}
          IS_PRERELEASE: ${{ needs.release.outputs.mode == 'prerelease' }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # `--notes` prepends to the generated notes rather than replacing
          # them, so upgrade guidance a reader needs before installing comes
          # first and the per-pull-request list still follows. The file is
          # committed so the guidance is reviewed with the code it describes
          # rather than typed into the GitHub UI at release time, which is how
          # it gets forgotten. Empty or absent means generated notes only.
          NOTES_FILE=.github/release-notes-preamble.md
          PREAMBLE_FLAG=()
          if [ -s "$NOTES_FILE" ]; then
            PREAMBLE_FLAG=(--notes "$(cat "$NOTES_FILE")")
            echo "::notice::Prepending $(wc -l < "$NOTES_FILE") lines from $NOTES_FILE"
          else
            echo "::notice::$NOTES_FILE is absent or empty; generated notes only"
          fi

          gh release create "$TAG" \
            --title "pika $TAG" \
            --generate-notes \
            "${PREAMBLE_FLAG[@]}" \
            $PRERELEASE_FLAG

  # Last, so a release that fails partway never publishes its docs, and called
  # with `uses:` so the deploy's conclusion is this run's. See RELEASE.md for the
  # ordering, the `smoke-test` dependency and how to recover a skipped deploy.
  deploy-docs:
    needs: [release, publish-pypi, smoke-test, github-release]
    # Same skip propagation as `deploy-dev-docs` in main.yaml: `smoke-test`
    # depends on `publish-test-pypi`, which is skipped in every mode except
    # `test`, so without opting out this is skipped on a real release and the
    # docs never publish - silently, because a skip is not a failure.
    if: >-
      ${{ !cancelled() &&
          (needs.release.outputs.mode == 'release' ||
           needs.release.outputs.mode == 'prerelease') &&
          needs.smoke-test.result == 'success' &&
          needs.github-release.result == 'success' }}
    # Required: a called workflow cannot elevate the caller's token.
    permissions:
      contents: write
    uses: ./.github/workflows/_deploy-docs.yaml
    with:
      ref: ${{ needs.release.outputs.version }}
      version: ${{ needs.release.outputs.docs-version }}
      aliases: ${{ needs.release.outputs.docs-aliases }}
      set-default: ${{ needs.release.outputs.docs-set-default == 'true' }}
