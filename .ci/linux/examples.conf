# The examples job's additions to rabbitmq.conf; see .ci/README.md.
# Listing any mechanism replaces the default list, so the defaults are repeated.
auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = AMQPLAIN
auth_mechanisms.3 = ANONYMOUS
auth_mechanisms.4 = EXTERNAL
# `rabbitmq:latest` turns the collector off, which leaves `/api/connections` empty.
management_agent.disable_metrics_collector = false
